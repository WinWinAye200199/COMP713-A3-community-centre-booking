<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Centre Staff Dashboard</title>

    <script src="app.js" defer></script>
</head>

<body>
    <header>
        <h1>Community Centre Staff Dashboard</h1>
        <p>Review and manage room booking requests.</p>
    </header>

    <main>
        <section id="login-section">
            <h2>Staff login</h2>

            <form id="login-form">
                <div>
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required>
                </div>

                <button id="login-button" type="submit">
                    Log in
                </button>
            </form>

            <p id="login-message" aria-live="polite"></p>
        </section>

        <section id="dashboard-section" hidden>
            <div>
                <h2>Booking requests</h2>
                <p id="staff-details"></p>

                <button id="show-pending-button" type="button">
                    Show pending
                </button>

                <button id="show-all-button" type="button">
                    Show all
                </button>

                <button id="refresh-button" type="button">
                    Refresh
                </button>

                <button id="logout-button" type="button">
                    Log out
                </button>
            </div>

            <p id="dashboard-message" aria-live="polite"></p>

            <div id="bookings-list">
                <p>Log in to view bookings.</p>
            </div>
        </section>
    </main>
</body>

</html>
